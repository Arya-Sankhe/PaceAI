# Single-origin MVP: Caddy terminates TLS, web + api behind it, collector on plant net.
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web, api]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    environment:
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion.worker"]
    env_file: .env
    restart: unless-stopped

  # Plant network only: enable with `docker compose --profile ot up collector`
  collector:
    build: ./backend
    command: ["python", "-m", "collector.edge_collector"]
    profiles: ["ot"]
    env_file: collector.env
    volumes: ["collector_outbox:/srv/outbox"]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  collector_outbox:
