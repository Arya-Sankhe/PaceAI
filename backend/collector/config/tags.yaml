  - {key: bx_error_active, node: "ns=6;s=::AsGlobalPV:Axis_BX.Status.ErrorActive",    type: Bool, class: event}
  - {key: bx_temp,         node: "ns=6;s=::AsGlobalPV:Axis_BX.Status.ActTemperature", unit: °C, class: fast}
