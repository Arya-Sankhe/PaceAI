  - {key: vs_is_homed,     node: "ns=6;s=::AsGlobalPV:Axis_VS.Status.IsHomed",        type: Bool, class: event}
  - {key: vs_in_sync,      node: "ns=6;s=::AsGlobalPV:Axis_VS.Status.InSync",         type: Bool, class: event}

