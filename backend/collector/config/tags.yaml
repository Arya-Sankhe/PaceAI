  - {key: ff_error_id,     node: "ns=6;s=::AsGlobalPV:Axis_FF.Status.ErrorID",        type: DInt, class: event}
  - {key: ff_error_active, node: "ns=6;s=::AsGlobalPV:Axis_FF.Status.ErrorActive",    type: Bool, class: event}
  - {key: ff_temp,         node: "ns=6;s=::AsGlobalPV:Axis_FF.Status.ActTemperature", unit: °C, class: fast}
  - {key: pk_rpm,          node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ActRevPerMinute", unit: rpm, class: fast}
  - {key: pk_current,      node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ActCurrent",      unit: A, class: fast}
  - {key: pk_error_id,     node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ErrorID",        type: DInt, class: event}
  - {key: pk_error_active, node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ErrorActive",    type: Bool, class: event}
  - {key: pk_temp,         node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ActTemperature", unit: °C, class: fast}
