# Signed tag manifest. Cloud never sends node IDs — this file is the allowlist.
# Keys match plc-dashboard's real OPC UA field names, so dummy fixtures and the
# live PLC are interchangeable downstream. Node IDs copied from plc-dashboard/server.py NODES.
# `::TBD:` nodes have no single real counterpart yet — verified per-node reads keep them harmless.
manifest_version: orion-v1
supported_by_collector: [orion-v1]

machines:
  - machine_key: orion_1
  - machine_key: orion_2

# class: fast = 1s snapshot, slow = 5s snapshot, event = immediate transition
defaults: {type: Float, q Good: true}

tags:
  # — 4 PID heater zones (per machine) —
  - {key: hor_front_temp,   node: "ns=6;s=::AsGlobalPV:AnaTemp.HorFront",               unit: °C, class: fast}
  - {key: hor_front_set,    node: "ns=6;s=::AsGlobalPV:gTempPar.Front.SetTemp",         unit: °C, class: slow}
  - {key: hor_front_output, node: "ns=6;s=::AsGlobalPV:gTempStatus.Front.HeatOutputInPer", unit: "%", class: fast, range: [0, 100]}
  - {key: hor_front_tol,    node: "ns=6;s=::AsGlobalPV:gTempStatus.Front.ZoneInTol",    type: Bool, class: event}
  - {key: hor_rear_temp,    node: "ns=6;s=::AsGlobalPV:AnaTemp.HorRear",                unit: °C, class: fast}
  - {key: hor_rear_set,     node: "ns=6;s=::AsGlobalPV:gTempPar.Rear.SetTemp",          unit: °C, class: slow}
  - {key: hor_rear_output,  node: "ns=6;s=::AsGlobalPV:gTempStatus.Rear.HeatOutputInPer",  unit: "%", class: fast, range: [0, 100]}
  - {key: hor_rear_tol,     node: "ns=6;s=::AsGlobalPV:gTempStatus.Rear.ZoneInTol",     type: Bool, class: event}
  - {key: vert1_temp,       node: "ns=6;s=::AsGlobalPV:AnaTemp.Vertical1",              unit: °C, class: fast}
  - {key: vert1_set,        node: "ns=6;s=::AsGlobalPV:gTempPar.Vertical1.SetTemp",     unit: °C, class: slow}
  - {key: vert1_output,     node: "ns=6;s=::AsGlobalPV:gTempStatus.Vertical1.HeatOutputInPer", unit: "%", class: fast, range: [0, 100]}
  - {key: vert1_tol,        node: "ns=6;s=::AsGlobalPV:gTempStatus.Vertical1.ZoneInTol", type: Bool, class: event}
  - {key: vert2_temp,       node: "ns=6;s=::AsGlobalPV:AnaTemp.Vertical2",              unit: °C, class: fast}
  - {key: vert2_set,        node: "ns=6;s=::AsGlobalPV:gTempPar.Vertical2.SetTemp",     unit: °C, class: slow}
  - {key: vert2_output,     node: "ns=6;s=::AsGlobalPV:gTempStatus.Vertical2.HeatOutputInPer", unit: "%", class: fast, range: [0, 100]}
  - {key: vert2_tol,        node: "ns=6;s=::AsGlobalPV:gTempStatus.Vertical2.ZoneInTol", type: Bool, class: event}

  # — 6 servo axes: BX box, CS cross-seal, FF film feed, PK poker, UW unwind, VS vertical seal —
  # (VS velocity node genuinely differs on the PLC — kept faithful, not a typo.)
  - {key: bx_rpm,      node: "ns=6;s=::AsGlobalPV:Axis_BX.Status.ActRevPerMinute", unit: rpm, class: fast}
  - {key: bx_current,  node: "ns=6;s=::AsGlobalPV:Axis_BX.Status.ActCurrent",      unit: A, class: fast}
  - {key: bx_error_id, node: "ns=6;s=::AsGlobalPV:Axis_BX.Status.ErrorID",        type: DInt, class: event}
  - {key: cs_rpm,      node: "ns=6;s=::AsGlobalPV:Axis_CS.Status.ActRevPerMinute", unit: rpm, class: fast}
  - {key: cs_current,  node: "ns=6;s=::AsGlobalPV:Axis_CS.Status.ActCurrent",      unit: A, class: fast}
  - {key: cs_error_id, node: "ns=6;s=::AsGlobalPV:Axis_CS.Status.ErrorID",        type: DInt, class: event}
  - {key: ff_rpm,      node: "ns=6;s=::AsGlobalPV:Axis_FF.Status.ActRevPerMinute", unit: rpm, class: fast}
  - {key: ff_current,  node: "ns=6;s=::AsGlobalPV:Axis_FF.Status.ActCurrent",      unit: A, class: fast}
  - {key: ff_error_id, node: "ns=6;s=::AsGlobalPV:Axis_FF.Status.ErrorID",        type: DInt, class: event}
  - {key: pk_rpm,      node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ActRevPerMinute", unit: rpm, class: fast}
  - {key: pk_current,  node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ActCurrent",      unit: A, class: fast}
  - {key: pk_error_id, node: "ns=6;s=::AsGlobalPV:Axis_PK.Status.ErrorID",        type: DInt, class: event}
  - {key: uw_rpm,      node: "ns=6;s=::AsGlobalPV:Axis_UW.Status.ActRevPerMinute", unit: rpm, class: fast}
  - {key: uw_current,  node: "ns=6;s=::AsGlobalPV:Axis_UW.Status.ActCurrent",      unit: A, class: fast}
  - {key: uw_error_id, node: "ns=6;s=::AsGlobalPV:Axis_UW.Status.ErrorID",        type: DInt, class: event}
  - {key: vs_rpm,      node: "ns=6;s=::AsGlobalPV:Axis_VS.Status.Velocity",       unit: rpm, class: fast}
  - {key: vs_current,  node: "ns=6;s=::AsGlobalPV:Axis_VS.Status.ActCurrent",      unit: A, class: fast}
  - {key: vs_error_id, node: "ns=6;s=::AsGlobalPV:Axis_VS.Status.ErrorID",        type: DInt, class: event}

  # — OEE / production counters (MVP set; TBD nodes verified on site) —
  - {key: count_good, node: "::TBD:verify-on-site-count_good", type: UDInt, unit: bags, class: slow}
  - {key: count_bad,  node: "::TBD:verify-on-site-count_bad", type: UDInt, unit: bags, class: slow}
  - {key: running,    node: "::TBD:verify-on-site-running", type: Bool, class: event}
  - {key: alarm_cnt,  node: "ns=6;s=::VisuCtrl:iVa_AlarmActivePulseCnt", type: UDInt, class: event}
  - {key: fault_code, node: "::TBD:verify-on-site-fault_code", type: DInt, class: event}
